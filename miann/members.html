<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members — Miann's Filthy Basement</title>
<meta name="description" content="Member access for Miann's Filthy Basement — drop your card, scan its QR code, or use your access link.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nosifer&family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #0a0908;
    --panel:     #1a100e;
    --panel-2:   #241512;
    --red:       #a8161c;
    --red-glow:  #e8232b;
    --bone:      #e6dfd2;
    --ash:       #6b6058;
    --line:      #3a1210;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--bone);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:1.4rem 1.5rem;
    border-bottom:1px solid var(--line);
  }

  header a{
    color:var(--ash);
    text-decoration:none;
    font-size:0.72rem;
    letter-spacing:0.08em;
  }
  header a:hover{ color:var(--red-glow); }

  main{
    max-width:640px;
    margin:0 auto;
    padding:3.5rem 1.5rem 5rem;
  }

  .page-title{
    font-family:'Nosifer', cursive;
    color:var(--red-glow);
    font-size:1.6rem;
    text-align:center;
    margin:0 0 0.6rem;
    text-shadow:0 0 18px rgba(232,35,43,0.35);
  }

  .page-sub{
    text-align:center;
    color:var(--ash);
    font-size:0.78rem;
    letter-spacing:0.05em;
    line-height:1.7;
    margin:0 0 2.8rem;
  }

  .page-sub b{ color:var(--bone); }

  footer{
    text-align:center;
    padding:2rem 1.5rem 3rem;
    color:var(--ash);
    font-size:0.68rem;
    letter-spacing:0.06em;
  }
  footer a{ color:var(--ash); }
</style>
</head>
<body>

<header>
  <a href="https://crithlabs.com/miann">← Back to Miann's Filthy Basement</a>
  <a href="https://crithlabs.com" target="_blank" rel="noopener">CrithLabs</a>
</header>

<main>
  <div class="page-title">MEMBER ACCESS</div>
  <div class="page-sub">
    Drop your card below, scan its QR code, or paste your access token.<br>
    Arrived here from an email link or a QR scan? <b>You're already being checked automatically.</b>
  </div>

  <div id="crith-access"></div>
  <script src="https://crithlabs-production.up.railway.app/cp.js" data-api="https://crithlabs-production.up.railway.app"></script>
</main>

<footer>
  Miann's Filthy Basement // CrithLabs Credential Protocol
</footer>

</body>
</html>
